<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Polar Star</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body class="noche">

  <!-- BARRA SUPERIOR: reloj y música, en segundo plano. En un cuadro de mandos lo
       importante es lo de abajo; esto es información de apoyo, no el protagonista. -->
  <header class="barra">
    <div class="reloj">
      <b id="reloj-hora">--:--</b>
      <span id="reloj-fecha"></span>
    </div>
    <div class="musica" id="m-zona">
      <div class="m-pista">
        <b id="m-titulo">—</b>
        <span id="m-artista"></span>
      </div>
      <div class="m-controles" id="m-controles">
        <button id="m-prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5l-11 7 11 7z"/></svg></button>
        <button id="m-play" aria-label="Reproducir o pausar"><svg viewBox="0 0 24 24" id="m-play-icono"><path d="M7 4l13 8-13 8z"/></svg></button>
        <button id="m-next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l11 7-11 7z"/></svg></button>
      </div>
    </div>
    <p class="m-aviso" id="m-aviso"></p>
  </header>

  <!-- INSTRUMENTOS. Los arcos los dibuja launcher.js a partir de la escala de cada
       magnitud: aquí no hay valores escritos a mano. -->
  <main class="cuadro">

    <section class="instrumento">
      <div class="esfera" id="med-rpm"></div>
      <span class="nombre">régimen</span>
    </section>

    <section class="instrumento principal">
      <div class="esfera" id="med-vel"></div>
      <div class="avisos">
        <span class="testigo" id="t-puertas">
          <svg viewBox="0 0 24 24"><path d="M4 4h9l5 5v11H4z"/><path d="M13 4v5h5"/></svg>
          <b id="t-puertas-texto">puertas</b>
        </span>
        <span class="testigo" id="t-luces">
          <svg viewBox="0 0 24 24"><path d="M3 12h6l4-5v10l-4-5H3z"/><path d="M16 8l4-3M16 12h5M16 16l4 3"/></svg>
          <b id="t-luces-texto">alumbrado</b>
        </span>
        <span class="leyenda" id="vel-aviso"></span>
      </div>
    </section>

    <section class="columna">
      <div class="instrumento pequeno">
        <div class="esfera" id="med-fuel"></div>
        <span class="nombre">combustible</span>
      </div>
      <div class="instrumento pequeno">
        <div class="esfera" id="med-temp"></div>
        <span class="nombre">motor</span>
      </div>
    </section>
  </main>

  <!-- Datos que no merecen un reloj propio: en texto, como las cifras del cuadro. -->
  <section class="tira">
    <span class="dato"><em>consumo</em><b id="d-consumo">—</b><i>l/100</i></span>
    <span class="dato"><em>autonomía</em><b id="d-rango">—</b><i>km</i></span>
    <span class="dato"><em>exterior</em><b id="d-ext">—</b><i>°C</i></span>
  </section>

  <footer class="accesos" id="accesos"></footer>

  <button class="ajustes" id="btn-ajustes" title="Ajustes del sistema">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
  </button>

  <script src="launcher.js"></script>
</body>
</html>
